name: Refresh EiBi snapshot

# The bundled station schedule and transmitter-site table
# (apps/web/src/server/eibi-snapshot.json) are what the server falls back on
# when eibispace.de can't be reached. EiBi's seasons switch on the last Sundays
# of March and October; a few days after each, this fetches the new season's
# file and EiBi's README (the site table) and opens a PR if either changed. A
# season file that isn't up yet fails the run (and GitHub emails about it): run
# it again by hand from the Actions tab once EiBi has posted it.
on:
  schedule:
    - cron: "0 6 1 4 *" # 1 April
    - cron: "0 6 1 11 *" # 1 November
  workflow_dispatch:
    inputs:
      season:
        description: "Season to fetch, like a27 or b27 (blank: the season it is now)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eibi-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pnpm pin as ci.yml, for the same reason.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch the season's schedule
        id: snapshot
        env:
          SEASON: ${{ inputs.season }}
        run: |
          if [ -n "$SEASON" ] && ! [[ "$SEASON" =~ ^[ab][0-9]{2}$ ]]; then
            echo "::error::Season must look like a27 or b27, not '$SEASON'."
            exit 1
          fi
          pnpm --filter web eibi:snapshot $SEASON

      - name: Open a PR if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          # Set when EiBi's README failed or was refused and the bundled sites were kept.
          SITES_NOTE: ${{ steps.snapshot.outputs.sites_note }}
          # The bundled table's site count and the new one's ("1,698 → 1,690").
          SITE_COUNTS: ${{ steps.snapshot.outputs.site_counts }}
        run: |
          file=apps/web/src/server/eibi-snapshot.json
          if git diff --quiet -- "$file"; then
            echo "The bundled schedule and transmitter sites are already current."
            exit 0
          fi
          season=$(node -p "require('./$file').season")
          branch="chore/eibi-snapshot-$season"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add "$file"
          git commit -m "chore(web): refresh the bundled EiBi schedule and transmitter sites ($season)"
          git push --force origin "$branch"
          checked="\`pnpm --filter web eibi:snapshot\` checked that both parse before saving them."
          if [ -n "$SITES_NOTE" ]; then
            checked="\`pnpm --filter web eibi:snapshot\` checked the schedule. The transmitter sites were NOT refreshed: $SITES_NOTE If the README is refused as under 80% season after season, EiBi may have really dropped sites, and the README's Station names section says how to take the smaller list."
          fi
          title="chore(web): refresh the bundled EiBi schedule and transmitter sites ($season)"
          body="The station schedule and transmitter-site table the server falls back on when eibispace.de can't be reached, refreshed for season $season by the \`Refresh EiBi snapshot\` workflow. $checked $SITE_COUNTS

          A PR opened by this workflow doesn't start CI on its own: close and reopen it, or push to it, to run the checks."
          # A rerun pushes a new commit to an open PR: refresh its body too, so it describes that commit.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base "$BASE" --title "$title" --body "$body"
          else
            gh pr edit "$branch" --body "$body"
          fi
