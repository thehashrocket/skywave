[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skywave-radio"
version = "0.1.0"
description = "KiwiSDR I/Q in, demodulated audio and waterfall out, over WebSocket"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.149",
  "uvicorn[standard]>=0.54",
  "websockets>=17",
  "numpy>=2.2",
  "scipy>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-timeout>=2.3", "httpx>=0.28", "matplotlib>=3.9", "trustme>=1.2"]

[tool.setuptools]
packages = ["skywave_radio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A broken deadline should fail a test, not hang the run.
timeout = 60
testpaths = ["tests"]
